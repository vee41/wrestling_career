<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wrestling Career — Balance Lab</title>
    <style>
      :root { color-scheme: dark; --ink:#efe9df; --muted:#aea99f; --paper:#171919; --panel:#212424; --line:#3b4140; --red:#ff6c5b; --gold:#ffcd63; --green:#6be6ae; --blue:#85b8ff; }
      * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at 90% 0%,#273338 0,transparent 28rem),var(--paper); color:var(--ink); font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif; }
      header { padding:34px clamp(20px,5vw,72px) 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:20px; align-items:end; }
      h1 { font-size:clamp(27px,4vw,46px); line-height:1; margin:0; letter-spacing:-.05em; } h1 span { color:var(--gold); } h2 { margin:0 0 14px; font-size:17px; } p { color:var(--muted); margin:8px 0 0; } button { font:inherit; color:var(--ink); background:#313838; border:1px solid #5a6361; border-radius:8px; padding:9px 12px; cursor:pointer; } button.primary { background:var(--gold); border-color:var(--gold); color:#17201f; font-weight:700; } button:disabled { opacity:.6; cursor:wait; }
      main { display:grid; grid-template-columns:minmax(290px,380px) minmax(0,1fr); gap:20px; padding:20px clamp(20px,5vw,72px) 56px; } .panel { background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid var(--line); border-radius:12px; padding:18px; } .controls { position:sticky; top:14px; align-self:start; max-height:calc(100vh - 28px); overflow:auto; } .control { padding:12px 0; border-top:1px solid #343a39; } .control:first-of-type { border-top:0; } .label-line { display:flex; justify-content:space-between; gap:12px; } label { font-weight:650; } output { color:var(--gold); font-variant-numeric:tabular-nums; } input[type="range"] { width:100%; accent-color:var(--gold); } .hint { font-size:12px; color:var(--muted); } .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; } .status { font-size:13px; min-height:20px; color:var(--muted); margin-top:12px; }
      .summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:20px; } .stat { background:#191c1c; border:1px solid var(--line); border-radius:9px; padding:14px; } .stat b { display:block; font-size:24px; letter-spacing:-.04em; } .pass { color:var(--green); } .fail { color:var(--red); } table { width:100%; border-collapse:collapse; font-size:13px; } th,td { border-bottom:1px solid #343a39; text-align:left; padding:7px 4px; } th { color:var(--muted); font-weight:550; } .pill { border-radius:99px; font-size:11px; font-weight:700; padding:3px 7px; background:#2f3735; display:inline-block; } .pill.fail { background:#4e2a28; } .loading { opacity:.55; }
      .seed-picker { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; } select { background:#191c1c; color:var(--ink); border:1px solid #5a6361; border-radius:7px; padding:7px 9px; font:inherit; } .criterion-panel { margin-bottom:14px; } .roster-layout { display:grid; grid-template-columns:minmax(430px,1.15fr) minmax(300px,.85fr); gap:14px; align-items:start; } .table-wrap { max-height:680px; overflow:auto; border:1px solid var(--line); border-radius:9px; } .roster-table { min-width:570px; } .roster-table th { position:sticky; top:0; background:#252a29; z-index:1; } .sort-header { background:transparent; border:0; border-radius:0; color:var(--muted); font-size:13px; font-weight:550; padding:0; white-space:nowrap; } .sort-header:hover { color:var(--gold); } .wrestler-row { cursor:pointer; } .wrestler-row:hover td, .wrestler-row.selected td { background:#313735; } .wrestler-row button { background:transparent; border:0; padding:0; color:var(--ink); font-weight:650; text-align:left; width:100%; } .delta { font-variant-numeric:tabular-nums; font-weight:700; } .delta.positive { color:var(--green); } .delta.negative { color:var(--red); } .mini-chart { width:86px; height:24px; display:block; background:#191c1c; border-radius:4px; } .detail { position:sticky; top:14px; max-height:680px; overflow:auto; } .detail-empty { color:var(--muted); padding:12px 0; } .detail-stat { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:10px 0 16px; } .detail-stat div { background:#191c1c; border:1px solid var(--line); border-radius:7px; padding:8px; } .detail-stat span { color:var(--muted); font-size:11px; display:block; } .log-list { list-style:none; padding:0; margin:0; } .log-list li { border-top:1px solid #343a39; padding:10px 0; } .log-title { display:flex; justify-content:space-between; gap:12px; font-weight:650; } .log-meta { color:var(--muted); font-size:12px; margin-top:3px; } @media (max-width:1000px) { .roster-layout { grid-template-columns:1fr; } .detail { position:static; max-height:none; } } @media (max-width:850px) { main { grid-template-columns:1fr; } .controls { position:static; max-height:none; } header { align-items:start; flex-direction:column; } .summary { grid-template-columns:1fr; } }
      .option-label { display:inline-flex; align-items:center; gap:6px; }
      .tooltip { display:inline-grid; place-items:center; width:17px; height:17px; margin-left:-6px; margin-right:auto; border:1px solid #6b7673; border-radius:50%; color:var(--gold); cursor:help; font-size:11px; font-weight:800; line-height:1; }
      .tooltip-popover { position:fixed; z-index:1000; width:250px; padding:9px 10px; border:1px solid #5a6361; border-radius:7px; background:#101313; color:var(--ink); box-shadow:0 8px 24px #0009; font-size:12px; line-height:1.35; pointer-events:none; }
    </style>
  </head>
  <body>
    <header><div><h1>Balance <span>Lab</span></h1><p id="scenario">Loading WWE 2026 popularity tuning…</p></div><button class="primary" id="verify">Run 3-seed gate</button></header>
    <main>
      <aside class="panel controls"><h2>Popularity tuning</h2><p>Each adjustment reruns one deterministic 26-week slice after a short pause. The 3-seed button is the acceptance check.</p><div id="controls"></div><div class="actions"><button id="reset">Reset baseline</button><button id="export">Download config.json</button></div><div class="status" id="status" aria-live="polite"></div></aside>
      <section id="results" aria-live="polite"><div class="panel">Adjust a slider to run the first slice.</div></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
